# SPDX-License-Identifier: MIT

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 (clang-cl)
            os: windows-2025
            cmake: -A x64 -T ClangCL
            artifact: citrusf2-windows-x64
          - name: macOS ARM64 (Apple Clang)
            os: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - uses: ./externals/xsflib/ci/build-and-test
        with:
          cmake: ${{ matrix.cmake }}
          artifact-name: ${{ matrix.artifact }}
          artifact-path: build/Release/citrusf2.exe
