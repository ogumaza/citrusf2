# SPDX-License-Identifier: MIT

# Builds citrusf2 whenever main changes: on Windows x64 with clang-cl, and on macOS ARM64. The Windows job runs ctest
# too. The macOS job builds without the tests (BUILD_TESTING=OFF). Changes to documentation alone don't start a run.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 (clang-cl)
            os: windows-2025
            cmake: -A x64 -T ClangCL
            artifact: citrusf2-windows-x64
          - name: macOS ARM64 (Apple Clang)
            os: macos-15
            cmake: -DBUILD_TESTING=OFF
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./externals/xsflib/ci/build-and-test
        with:
          cmake: ${{ matrix.cmake }}
          artifact-name: ${{ matrix.artifact }}
          artifact-path: build/Release/citrusf2.exe
